<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — Nolan Chai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      background: #fff;
      color: #0a0a0a;
      font-size: 0.78rem;
      line-height: 1.65;
      padding: 48px 20px 72px;
      overflow-x: hidden;
    }

    /* ── GoL canvas ── */
    #gol-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.04;
    }
    .container {
      position: relative; z-index: 1;
      max-width: 460px; margin: 0 auto;
      background: rgba(255,255,255,0.88);
      padding: 0 14px;
    }

    /* ── Header row ── */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2.5rem;
    }
    .site-name {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: inherit;
    }
    .site-name:hover { text-decoration-color: transparent; }
    .nav-link {
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      color: #aaa;
      transition: color 0.15s;
    }
    .nav-link:hover { color: #0a0a0a; }
    .nav-link.active { color: #2563EB; font-weight: 600; }

    /* ── Links ── */
    a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #d0cfc7;
      transition: text-decoration-color 0.15s;
    }
    a:hover { text-decoration-color: #0a0a0a; }

    /* ── Page title ── */
    .page-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    .page-title .tagline {
      font-size: 0.62rem;
      font-weight: 400;
      color: #aaa;
      letter-spacing: 0.01em;
    }

    /* ── Section ── */
    .section-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #2563EB;
      margin-bottom: 0.35rem;
      margin-top: 2.75rem;
    }
    .page-title + .section-label { margin-top: 0.5rem; }
    .section-sub {
      font-size: 0.63rem;
      color: #aaa;
      margin-bottom: 1.1rem;
      font-style: italic;
    }

    /* ── Note links ── */
    .note-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .note-card {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.35rem 1rem;
      padding: 0.9rem 0.75rem;
      border: 1px solid #d0cfc7;
      background: #fafaf8;
      text-decoration: none;
      transition: box-shadow 0.12s ease;
    }
    .note-card:hover { box-shadow: 3px 3px 0 #0a0a0a; }
    .note-card:focus-visible { outline: 2px solid #2563EB; outline-offset: 4px; }
    .note-title { font-size: 0.74rem; font-weight: 600; }
    .note-meta { display: flex; gap: 0.75rem; align-items: baseline; }
    .note-date { font-size: 0.63rem; color: #777; }
    .note-arrow { color: #2563EB; }

    /* ── Footer ── */
    .footer {
      margin-top: 3.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e8e7e0;
      font-size: 0.65rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header-row">
      <a href="index.html" class="site-name">Nolan Chai</a>
      <span class="nav-link active">notes</span>
    </div>

    <h1 class="page-title">
      Notes
      <span class="tagline">a collection of scrawls</span>
    </h1>

    <div class="section-label">Approach,</div>
    <div class="section-sub">or the velocity which my heart seeks</div>

    <div class="note-list">
      <a class="note-card" id="good-work-takes-care" href="good-work-takes-care.html">
        <span class="note-title">Good Work Takes Care</span>
        <span class="note-meta">
          <time class="note-date" datetime="2026-11">Nov 2026</time>
          <span class="note-arrow" aria-hidden="true">→</span>
        </span>
      </a>
      <a class="note-card" href="towards-ataraxia.html">
        <span class="note-title">towards ataraxia</span>
        <span class="note-meta">
          <time class="note-date" datetime="2026-03">Mar 2026</time>
          <span class="note-arrow" aria-hidden="true">→</span>
        </span>
      </a>
    </div>

    <footer class="footer">nolanchai.dev</footer>

  </div>

  <canvas id="gol-canvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('gol-canvas');
      const ctx    = canvas.getContext('2d');
      const CELL   = 6, FILL = 0.16, TICK = 160;
      let cols, rows, grid, next;

      function newGrid() { return Array.from({ length: rows }, () => new Uint8Array(cols)); }
      function seed() {
        grid = newGrid();
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            grid[r][c] = Math.random() < FILL ? 1 : 0;
      }
      function resize() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        cols = Math.ceil(canvas.width / CELL); rows = Math.ceil(canvas.height / CELL);
        if (!grid) { seed(); return; }
        const g = newGrid();
        for (let r = 0; r < Math.min(rows, grid.length); r++)
          for (let c = 0; c < Math.min(cols, (grid[0]||[]).length); c++)
            g[r][c] = grid[r][c];
        grid = g;
      }
      function step() {
        next = newGrid();
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++) {
            let n = 0;
            for (let dr = -1; dr <= 1; dr++)
              for (let dc = -1; dc <= 1; dc++) {
                if (!dr && !dc) continue;
                n += grid[(r+dr+rows)%rows][(c+dc+cols)%cols];
              }
            const a = grid[r][c];
            next[r][c] = (a && (n===2||n===3)) || (!a && n===3) ? 1 : 0;
          }
        grid = next;
      }
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0a0a0a';
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            if (grid[r][c]) ctx.fillRect(c*CELL+1, r*CELL+1, CELL-1, CELL-1);
      }
      resize();
      window.addEventListener('resize', resize);
      setInterval(() => { step(); draw(); }, TICK);
      draw();
    })();
  </script>

</body>
</html>
